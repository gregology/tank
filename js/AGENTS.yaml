context:
  - content: |
      The module dependency graph is:
        main.js → game.js, renderer.js, audio.js, menu.js, input.js
        game.js → map.js, tank.js, bullet.js, particles.js, camera.js,
                  ai.js, modes.js, projectiles.js, ai/targeting.js, vehicles/
        ai.js → pathfinder.js, vehicles/, ai/   (thin controller)
        ai/ → config.js
        menu.js → lobby.js, menu/               (thin shell)
        menu/ → config.js, render/vehicles/, render/canvas-utils.js
        config.js → config/                     (barrel; config/ imports nothing)
        modes.js → config.js, entity.js         (uses the public Game API)
        map.js → map/                           (facade over the js/map/ package)
        map/ → config.js, utils.js
        renderer.js → js/render/*, layout.js    (thin shell)
        js/render/* → config.js, utils.js, draw-helpers.js, formation.js
      All modules import config.js and utils.js.  Avoid circular dependencies.
    match: ["**"]
    on: [edit, create]
    when: before

  - content: |
      config.js exports TILES (tile type enum), TILE_PROPS (per-tile
      semantics: passable/solid/road/water/building/height/hp), and CONFIG
      (all constants).  Adding a tile type = a new TILES id + a new TILE_PROPS
      row; the tile-property queries in js/map/grid.js read that table, so no
      switch statements need editing.  Visuals still need js/render/tiles.js
      (drawTile switch), js/render/minimap.js (TILE_COLORS), and
      js/render/canvas-utils.js (PALETTE).
    match: ["config.js"]
    on: edit
    when: after

  - content: |
      game.js builds a match from a MatchConfig (gameType, humans with
      devices/teams, settings).  Faction composition is decided by the pure
      planFactions() in factions.js (bots fill Battle teams to teamSize;
      Skirmish adds one bot only when every human is on one team).  game.js
      materialises that plan into Tank/Camera/AIController entities.
      The allTanks/factions/humanTanks getters provide a uniform interface
      for the renderer across game types.
    match: ["game.js"]
    on: read
    when: before

  - content: |
      Map generation order matters (js/map/generation.js generate()):
        1. baseTile() — water/sand/grass for every cell
        2. placeVillages() — stamps paved roads, buildings, then dirt roads
        3. buildBaseCompounds() (js/map/compounds.js) called by battle mode
           init (js/modes.js) — clears terrain around the two bases, stamps
           compound walls/towers/HQ, carves a path between them
      GameMap (js/map.js) is a facade over the js/map/ package: grid.js
      (tile data + queries), queries.js (spatial geometry), generation.js
      (procedural terrain), compounds.js (base layout + spawn helpers).
      Village placement enforces 14-tile minimum separation between centres.
      Dirt roads use cardinal-step algorithm (no diagonal-only connections).
    match: ["map.js"]
    on: read
    when: before

  - content: |
      js/render/vehicles/tank.js drawTank() projects every polygon from local
      tank space (+x = forward, +y = right) through rotation + isometric
      transform (shared makeProjection in js/render/projection.js).
      Layers stack with pixel offsets: tracks → hull → barrel → turret.
      Each layer has a dark "extrusion" slab drawn below its top face for 3D effect.
      The five sprites live in js/render/vehicles/ (one module each), dispatched
      by drawVehicle via the SPRITES registry in js/render/vehicles/index.js.
    match: ["renderer.js", "js/render/*"]
    on: read
    when: before

  - content: |
      The AI controller (ai.js) implements the same InputDevice interface
      (isDown/wasPressed/analog/endFrame) over the ACTIONS vocabulary from
      config.js.  Each AI instance holds its own `keys` record of action
      names — multiple bots sharing the same action names don't conflict.
      To add difficulty levels, tune aimWobble, fireDelay, and the
      engagement range in the think() method.
    match: ["ai.js"]
    on: [read, edit]
    when: before

  - content: |
      Sound is procedurally synthesised via Web Audio API — no audio files.
      AudioManager hooks into the Game event bus:
        game.on('fire',         () => audio.playShoot())
        game.on('destroy',      () => audio.playExplosion())
        game.on('destroy_tile', () => audio.playExplosion())
        game.on('impact',       () => audio.playImpact())
        game.on('win',          () => audio.playWin())
      To add a new sound, create a method on AudioManager and wire it to
      a game event in hookIntoGame().
    match: ["audio.js"]
    on: [edit, create]
    when: before

decisions:
  - decision: "Game event bus for cross-cutting concerns (sound, UI)"
    rationale: "Loose coupling — audio.js subscribes to game events without game.js knowing about audio"
    alternatives:
      - option: "Direct function calls from game.js to audio.js"
        reason_rejected: "Tight coupling, game.js would need to import audio.js"
    match: ["game.js", "audio.js"]
    date: 2025-03-24

  - decision: "Pathfinder wall-cost overlay for wider berth around walls"
    rationale: "Tiles adjacent to impassable terrain get a penalty (0.3 per neighbour) so A* naturally routes through the centre of corridors"
    alternatives:
      - option: "Inflate obstacles by 1 tile (mark adjacent tiles as impassable)"
        reason_rejected: "Closes narrow passages entirely, makes 1-tile gaps unwalkable"
      - option: "No wall cost — pure shortest path"
        reason_rejected: "Bots hug walls and clip corners, getting stuck on edges"
    revisit_when: "Wall-cost computation becomes a performance issue on larger maps"
    match: ["pathfinder.js"]
    date: 2025-03-25
